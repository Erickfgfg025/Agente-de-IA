name: Keep Documento Pronto responsive

on:
  schedule:
    # The shortest supported GitHub Actions schedule interval is 5 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake and verify Render service
        env:
          HEALTH_URL: https://documento-pronto-bd9e.onrender.com/healthz
        run: |
          set -eu
          status="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' --max-time 90 "$HEALTH_URL" || true)"
          cat /tmp/health.json 2>/dev/null || true
          if [ "$status" != "200" ]; then
            echo "Health check failed with HTTP ${status:-unknown}."
            exit 1
          fi
          echo "Health check passed."
